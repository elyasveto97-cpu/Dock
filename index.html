<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocK — Quais LAVL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* Palette officielle Intelcom (Quick Guideline 2024) */
  --turq:#00A68F; --black:#000000; --white:#FFFFFF;
  --lblue:#4BC8F3; --red:#F24438; --orange:#F88223; --yellow:#FDED50; --pinkb:#FAA0C5; --blueb:#1069A9;
  --bg:#F2F4F3; --panel:#fff; --ink:#000000; --mute:#5f6b68; --line:#d9dfdd;
  --teal:var(--turq); --pink:var(--pinkb); --blue:var(--blueb);
  --free:#ffffff; --ok:var(--turq); --nc:var(--red); --hs:#a7b0ae;
  --wall:#1a1a1a; --bar:#000000;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--turq);color:#fff}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:30px;display:block}.brand .sep{width:1px;height:34px;background:#ffffff66}
.logo{font-weight:800;font-size:22px;letter-spacing:.3px;line-height:1}.logo b{color:var(--black)}
.sub{font-size:12px;opacity:.75}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chip{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:#00000026;display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #0003}
.hbtn{background:#ffffff26;border:1px solid #ffffff59;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.hbtn:hover{background:#ffffff33}
#search{border-radius:8px;border:none;padding:7px 10px;width:150px;font-size:13px}
#clock{font-variant-numeric:tabular-nums;font-weight:700}
#sync{font-size:12px}
html,body{height:100%}
body{display:flex;flex-direction:column}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px 0}
.yardwrap{flex:1;min-height:420px;display:flex;background:var(--panel);border-radius:14px 14px 0 0;padding:12px 12px 0;box-shadow:0 1px 3px #0001;overflow-x:auto}
.yard{flex:1;display:flex;align-items:stretch;width:max-content;min-width:100%}
.group{display:flex;flex:none}
.row{display:flex;flex:1}
.gap{flex:0 0 28px;display:flex;flex-direction:column;justify-content:flex-end}
.gap .wallseg{height:40px;background:var(--wall)}
.dock{flex:0 0 var(--dw,120px);width:var(--dw,120px);display:flex;flex-direction:column}
/* camion dessiné en CSS : il s'étire sur toute la hauteur */
.truck{--fill:#fff;--st:#1a1a1a;--tx:#8a9592;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;background:none;border:none;padding:0 12px;position:relative}
.truck.s-vert{--fill:var(--turq);--st:#00705f;--tx:#fff}
.truck.s-rouge{--fill:var(--red);--st:#a3241b;--tx:#fff}
.truck.s-hs{--fill:#c9cfd6;--st:#7c8590;--tx:#4a5563}
.cab{width:70%;height:calc(var(--dw,120px)*.55);flex:none;background:var(--fill);border:2.5px solid var(--st);border-radius:9px 9px 4px 4px;position:relative}
.cab::before{content:"";position:absolute;left:8px;right:8px;top:7px;height:28%;border-radius:3px;background:var(--lblue);opacity:.7}
.cab::after{content:"";position:absolute;left:-9px;right:-9px;top:45%;height:28%;border-left:7px solid #000;border-right:7px solid #000}
.hitch{width:14%;height:10px;flex:none;background:var(--st)}
.trailer{flex:1;width:100%;min-height:0;background:var(--fill);border:2.5px solid var(--st);border-bottom-width:6px;border-radius:4px 4px 2px 2px;position:relative}
.trailer::after{content:"";position:absolute;left:-9px;right:-9px;bottom:8%;height:14%;max-height:90px;border-left:7px solid #000;border-right:7px solid #000}
.truck:hover .trailer,.truck:hover .cab{box-shadow:0 0 0 3px #0f969055}
.truck:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.truck.hl .trailer,.truck.hl .cab{box-shadow:0 0 0 4px var(--lblue)}
.tl{position:absolute;inset:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--tx);pointer-events:none;overflow:hidden;text-align:center}
.tl .code{font-size:calc(var(--dw,120px)*.2);font-weight:900;letter-spacing:1px;background:#fff;color:var(--ink);border-radius:8px;padding:2px 10px;line-height:1.2}
.tl .ref{font-weight:800;font-size:calc(var(--dw,120px)*.115);line-height:1.15;word-break:break-all;max-width:100%}
.tl .big{font-weight:800;font-size:calc(var(--dw,120px)*.15);letter-spacing:1.5px;opacity:.75}
.tl .sm{font-size:calc(var(--dw,120px)*.1);font-weight:700;opacity:.9}
.tl .tm{font-size:calc(var(--dw,120px)*.12);font-weight:800;background:#0005;color:#fff;border-radius:6px;padding:2px 8px}
.tl .tm.warn{background:var(--orange)}.tl .tm.alert{background:#7a0000;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.tl .badge{white-space:nowrap;font-size:calc(var(--dw,120px)*.095);font-weight:800;background:#fff;color:var(--ink);border-radius:5px;padding:1px 6px}
.tl .badge.nc{color:#a61f1f}
#tip{position:fixed;z-index:40;background:#1b2430;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 10px 30px #0006;pointer-events:none;display:none;max-width:340px}
#tip h4{margin:0 0 6px;font-size:14px}
#tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
#tip dt{color:#9fb0c3}#tip dd{margin:0;font-weight:600;word-break:break-word}
.zoom{display:flex;gap:4px}
.tag{font-size:11px;text-align:center;color:var(--mute);height:22px;line-height:1.05;overflow:hidden;padding:2px 1px 0;flex:none}
.num{flex:none;background:var(--bar);color:#fff;text-align:center;font-weight:800;font-size:20px;padding:10px 0 12px;border-left:1px solid #ffffff22}
.dock.st-vert .num{background:var(--ok)}
.dock.st-rouge .num{background:var(--nc)}
.dock.st-hs .num{background:var(--hs)}
/* modal */
.ov{position:fixed;inset:0;background:#0b1220aa;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.open{display:flex}
.modal{background:var(--panel);border-radius:16px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px #0005}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h2{margin:0;font-size:18px}
.mh .pill{margin-left:auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff}
.mb{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;padding:11px 8px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--turq);background:#e2f5f2;color:#00705f}
.seg.yn button.on.y{border-color:var(--turq);background:#e2f5f2;color:#00705f}
.seg.yn button.on.n{border-color:var(--red);background:#fdeceb;color:#a3241b}
input[type=text],textarea,select{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
select[size]{padding:4px}
.btn{padding:11px 18px;border-radius:10px;border:none;font-weight:800}
.btn.p{background:var(--black);color:#fff}.btn.p:disabled{background:#b9bfbd;cursor:not-allowed}
.btn.g{background:#e9edf2;color:var(--ink)}
.btn.teal{background:var(--teal);color:#fff}.btn.teal:disabled{background:#9fd8cf;cursor:not-allowed}
.btn.blue{background:var(--blue);color:#fff}
.btn.red{background:var(--nc);color:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.ok:disabled{background:#9fd8cf;cursor:not-allowed}
.link{background:none;border:none;color:var(--mute);text-decoration:underline;font-size:12px;padding:0;align-self:flex-start}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;user-select:none}
.step input{width:20px;height:20px;accent-color:var(--ok)}
.step .n{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.step.chk{border-color:#9bd4b2;background:#f2fbf5}
.q{font-weight:800;font-size:15px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.info dt{color:var(--mute)}.info dd{margin:0;font-weight:600}
.alertbox{background:#fdeceb;border:1.5px solid #f7b3ae;color:#a3241b;border-radius:10px;padding:10px;font-size:14px}
.okbox{background:#e2f5f2;border:1.5px solid #8fd6cb;color:#00705f;border-radius:10px;padding:10px;font-size:14px}
.hint{font-size:12px;color:var(--mute)}
.ev{font-size:12px;color:var(--mute);border-left:3px solid var(--line);padding-left:8px}
/* panels */
.wide{width:min(1100px,100%)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#f5f7fa;font-size:12px}
.tbl{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:640px){header{padding:10px}#search{width:110px}.chips{margin-left:0}main{padding:10px}}
</style>
</head>

/* Appel sans cookies (credentials:'omit') : évite le bug Google « plusieurs comptes connectés »
   — se comporte comme une fenêtre de navigation privée */
async function jsonp(params){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch(CONFIG.API_URL+'?'+new URLSearchParams({...params,key:CONFIG.API_KEY}),{credentials:'omit',redirect:'follow',signal:ctrl.signal,cache:'no-store'});
    const txt=await r.text();
    try{return JSON.parse(txt)}catch(e){throw 'Réponse non JSON (HTTP '+r.status+') : '+txt.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').slice(0,160)}
  }catch(e){throw e&&e.name==='AbortError'?'timeout':(typeof e==='string'?e:'net')}
  finally{clearTimeout(t)}
}

  el.innerHTML=`<i class="dot" style="background:${syncOk?'#3ddc84':syncOk===false?'#ff5252':'#ffc107'}"></i>${syncOk?L('En ligne'):syncOk===false?L('Hors ligne'):'…'}`;
}
async function pull(){
  if(!online())return;
  try{
    const d=await jsonp({action:'get'});
    if(!d.ok)throw 'Réponse Apps Script : '+JSON.stringify(d);
    DOCKS.forEach(n=>{S.docks[n]=d.docks[n]||freeDock()});
    if(Array.isArray(d.history))S.history=d.history;
    if(Array.isArray(d.vrids))S.vrids=d.vrids;
    lsSet();lastErr='';setSync(true);render();
  }catch(e){lastErr=e==='net'?'Le script ne répond pas (URL invalide, ou accès du déploiement pas sur « Tout le monde »).':e==='timeout'?'Pas de réponse en 15 s (Apps Script lent ou URL incorrecte).':String(e);setSync(false)}
}
async function pushDock(n){
  lsSet();
  if(!online())return;
  try{const d=await jsonp({action:'setDock',dock:n,data:JSON.stringify(S.docks[n])});setSync(!!d.ok)}catch(e){setSync(false);toast(L('⚠ Sync échouée — réessai auto'))}
}
async function pushHist(h){
  lsSet();
  if(!online())return;
  try{await jsonp({action:'log',data:JSON.stringify(h)})}catch(e){setSync(false)}
}
/* VRIDs Station One — la source sera branchée quand le lien sera fourni.
   Format attendu: [{vrid:'XXXX', info:'transporteur / ETA / …'}] */
async function pullVrids(){
  if(!online())return;
  try{const d=await jsonp({action:'vrids'});if(d.ok&&Array.isArray(d.vrids)){S.vrids=d.vrids;lsSet()}}catch(e){}
}

/* ================= RENDU DU PLAN ================= */
function buildYard(){
  const y=$('#yard');let h='';
  GROUPS.forEach((g,i)=>{
    if(i)h+='<div class="gap"><div class="wallseg"></div></div>';
    h+=`<div class="group" style="--n:${g.to-g.from+1}"><div class="row">`;
    for(let n=g.from;n<=g.to;n++)h+=`<div class="dock" id="d${n}"><button class="truck" data-n="${n}" aria-label="${L('Quai')} ${n}"><div class="cab"></div><div class="hitch"></div><div class="trailer"><div class="tl"></div></div></button><div class="tag">${TAGS[n]?L(TAGS[n]):''}</div><div class="num">${n}</div></div>`;
    h+='</div></div>';
  });
  y.innerHTML=h;
  y.querySelectorAll('.truck').forEach(b=>b.onclick=()=>openDock(+b.dataset.n));
}
function render(){
  const q=$('#search').value.trim().toUpperCase();
  let c={libre:0,vert:0,rouge:0,hs:0};
  DOCKS.forEach(n=>{
    const d=S.docks[n],st=d.status;c[st]++;
    const el=$('#d'+n);el.className='dock st-'+st;
    const b=el.querySelector('.truck');
    let lab='';
    if(st==='vert'||st==='rouge'){
      const m=mins(d.checkinAt);
      const cls=m>=CONFIG.ALERT_MIN?'alert':m>=CONFIG.WARN_MIN?'warn':'';
      const top=st==='rouge'?`<span class="badge nc">⚠ ${L(({SECU:'SÉCU',OUV:'OUVERT.',LIB:'LIBÉR.'})[d.ncKey]||'')}</span>`:`<span class="badge">${L(d.op==='CHARGEMENT'?'CHARG.':'DÉCHARG.')}</span>`;
      const mt=metaOf(d);const gp=[mt.gaylords?mt.gaylords+' G':'',mt.palettes?mt.palettes+' P':''].filter(Boolean).join(' · ');
      lab=`${top}${d.code?`<span class="code">${esc(d.code)}</span>`:''}<span class="ref">${esc(refLabel(d))}</span>${gp?`<span class="sm" title="Gaylords · Palettes">${gp}</span>`:''}<span class="tm ${cls}">${fmtDur(m)}</span>`;
    } else if(st==='hs') lab=`<span class="big">${L('HORS<br>SERVICE')}</span>${d.note?`<span class="sm">${esc(d.note)}</span>`:''}`;
    else lab=`<span class="big">${L('LIBRE')}</span>`;
    b.className='truck s-'+st;
    b.querySelector('.tl').innerHTML=lab;
    b.removeAttribute('title');
    b.classList.toggle('hl',!!q&&!!d.ref&&String(d.ref).toUpperCase().includes(q));
  });
  $('#stats').innerHTML=`<span class="chip"><i class="dot" style="background:#fff"></i>${L('Libres')} ${c.libre}</span>
   <span class="chip"><i class="dot" style="background:var(--ok)"></i>${L('Prêts')} ${c.vert}</span>
   <span class="chip" style="${c.rouge?'background:var(--nc)':''}"><i class="dot" style="background:var(--nc)"></i>${L('Non conformes')} ${c.rouge}</span>
   ${c.hs?`<span class="chip"><i class="dot" style="background:var(--hs)"></i>${L('HS')} ${c.hs}</span>`:''}`;
  $('#uName').textContent=S.user||'—';
}

/* ================= MODALES ================= */
const ov=$('#ov'),M=$('#modal');
function show(html,wide){M.className='modal'+(wide?' wide':'');M.innerHTML=html;ov.classList.add('open')}
function close(){ov.classList.remove('open');M.innerHTML=''}
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function head(n,title,color){return `<div class="mh"><h2>${L('Quai')} ${n} · ${title}</h2><span class="pill" style="background:${color}">${groupOf(n).name}${TAGS[n]?' · '+TAGS[n]:''}</span></div>`}
function ev(d,step,note,extra){(d.events=d.events||[]).push({t:now(),step,user:S.user||'',note:note||'',...(extra||{})})}

function openDock(n){
  const d=S.docks[n];
  if(d.status==='libre')checkin(n);
  else if(d.status==='vert')greenModal(n);
  else if(d.status==='rouge')redModal(n);
  else hsModal(n);
}

/* ---- CHECK-IN ---- */
function checkin(n,draft){
  const g=groupOf(n);
  const dr=draft||{type:'VRID',ref:'',op:g.op,search:''};
  const used=new Set(DOCKS.map(k=>S.docks[k]).filter(x=>x.type==='VRID'&&x.status!=='libre').map(x=>x.ref));
  const RANK={arrived:0,at_station:0,in_transit:1,planned:2,completed:4};
  const list=S.vrids.slice().sort((a,b)=>(RANK[a.statut]??3)-(RANK[b.statut]??3)).filter(v=>!used.has(v.vrid)&&(!dr.search||(v.vrid+' '+(v.code||'')+' '+(v.info||'')).toUpperCase().includes(dr.search.toUpperCase())));
  let sub='';
  if(dr.type==='VRID'){
    sub=`<div><div class="lbl">VRID (Station One)</div>
      <input type="text" id="vs" placeholder="${L('Rechercher ou saisir un VRID…')}" value="${esc(dr.search)}" autocomplete="off">
      <select id="vl" size="6" style="margin-top:6px">${list.map(v=>`<option value="${esc(v.vrid)}" ${v.vrid===dr.ref?'selected':''}>${esc(v.vrid)}${v.code?' · '+esc(v.code):''}${v.gaylords?' · '+v.gaylords+' G':''}${v.palettes?' · '+v.palettes+' P':''}${v.statut?' · '+esc(v.statut):v.info?' — '+esc(v.info):''}</option>`).join('')||''}</select>
      <div class="hint">${S.vrids.length?list.length+L(' VRID disponible(s) · '):L('Liste Station One pas encore branchée — saisis le VRID à la main. ')}${dr.ref?L('Sélectionné : ')+'<b>'+esc(dr.ref)+'</b>':''}</div></div>`;
  } else if(dr.type==='AUTRE'){
    sub=`<div><div class="lbl">${L('Préciser')}</div><input type="text" id="ao" placeholder="${L('Ex. : retour transporteur, camion vide, inspection…')}" value="${esc(dr.ref)}"></div>`;
  } else sub=`<div class="okbox">${L('Remorque de palettes — aucune référence requise.')}</div>`;
  const valid=dr.type==='PALETTE'||!!dr.ref.trim();
  show(`${head(n,'Check-in','var(--bar)')}
   <div class="mb">
    <div><div class="lbl">${L('Type')}</div><div class="seg" id="ty">${['VRID','PALETTE','AUTRE'].map(t=>`<button data-t="${t}" class="${dr.type===t?'on':''}">${t==='PALETTE'?L('Palette'):t==='AUTRE'?L('Autre'):t}</button>`).join('')}</div></div>
    ${sub}
    <div><div class="lbl">${L('Opération')}</div><div class="seg" id="op">${['DECHARGEMENT','CHARGEMENT'].map(o=>`<button data-o="${o}" class="${dr.op===o?'on':''}">${L(OPLBL[o])}</button>`).join('')}</div></div>
    <div><div class="lbl">${L('Opérateur')}</div><input type="text" id="us" placeholder="${L('Ton nom')}" value="${esc(S.user)}"></div>
    <button class="link" id="hsb">${L('Mettre ce quai hors service')}</button>
   </div>
   <div class="mf"><button class="btn g" id="cx">${L('Annuler')}</button><button class="btn teal" id="go" ${valid?'':'disabled'}>${L('Sécurisation →')}</button></div>`);
  M.querySelectorAll('#ty button').forEach(b=>b.onclick=()=>{dr.type=b.dataset.t;dr.ref='';dr.search='';checkin(n,dr)});
  M.querySelectorAll('#op button').forEach(b=>b.onclick=()=>{dr.op=b.dataset.o;checkin(n,dr)});
  const vs=$('#vs'),vl=$('#vl'),ao=$('#ao'),go=$('#go');
  if(vs){
    vs.oninput=()=>{dr.search=vs.value;dr.ref=vs.value.trim().toUpperCase();
      const pos=vs.selectionStart;checkin(n,dr);const v2=$('#vs');v2.focus();v2.setSelectionRange(pos,pos)};
    vl.onchange=()=>{dr.ref=vl.value;dr.search=vl.value;checkin(n,dr)};
    if(!draft)setTimeout(()=>vs.focus(),30);
  }
  if(ao)ao.oninput=()=>{dr.ref=ao.value;go.disabled=!ao.value.trim()};
  $('#us').oninput=e=>{S.user=e.target.value.trim();lsSet();$('#uName').textContent=S.user||'—'};
  $('#cx').onclick=close;
  $('#hsb').onclick=()=>hsSet(n);
  go.onclick=()=>{
    if(!S.user){toast(L('Indique ton nom d’opérateur'));$('#us').focus();return}
    if(dr.type==='VRID'&&used.has(dr.ref)){toast(L('Ce VRID est déjà à un autre quai'));return}
    const vi=dr.type==='VRID'?S.vrids.find(v=>v.vrid===dr.ref.trim()):null;
    const d={status:'libre',type:dr.type,ref:dr.type==='PALETTE'?'':dr.ref.trim(),info:vi?vi.info||'':'',code:vi?vi.code||'':'',meta:vi?vi:null,op:dr.op,checkinAt:now(),user:S.user,events:[]};
    ev(d,'CHECK-IN');
    phase(n,'SECU',d);
  };
}

/* ---- PHASE (Sécurisation / Ouverture / Libération) ---- */
function phase(n,key,d,state){
  const P=PHASES[key];
  const s=state||{chk:{},ans:null,note:''};
  const all=P.steps.every(([k])=>s.chk[k]);
  const okLabel=L('Oui');
  show(`${head(n,L(P.title),P.color)}
   <div class="mb">
    <div class="info"><dt>${L('Référence')}</dt><dd>${esc(refLabel(d))}</dd><dt>${L('Opération')}</dt><dd>${L(OPLBL[d.op])}</dd></div>
    <div class="steps">${P.steps.map(([k,t])=>`<label class="step ${s.chk[k]?'chk':''}"><span class="n" style="background:${P.color}">${k}</span><span style="flex:1">${L(t)}</span><input type="checkbox" data-k="${k}" ${s.chk[k]?'checked':''}></label>`).join('')}</div>
    <div class="q">${L(P.q)}</div>
    <div class="seg yn"><button class="y ${s.ans==='oui'?'on':''}" data-a="oui">✔ ${okLabel}</button><button class="n ${s.ans==='non'?'on':''}" data-a="non">✖ ${L('Non')}</button></div>
    ${s.ans==='non'?`<div><div class="lbl">${L('Problème constaté (optionnel)')}</div><textarea id="nt" placeholder="${L('Ex. : cale manquante, verrou défectueux…')}">${esc(s.note)}</textarea>
      <div class="alertbox" style="margin-top:8px">${L('Le camion passera en <b>ROUGE (non conforme)</b>.')}</div></div>`:''}
    ${s.ans==='oui'&&key==='SECU'?'<div class="okbox">'+L('Étape suivante : <b>Ouverture</b> (7 à 10).')+'</div>':''}
    ${s.ans==='oui'&&key==='OUV'?`<div class="okbox">${L('Le camion passera en <b>VERT</b> — prêt pour le {op} (étape 11).').replace('{op}',L(OPLBL[d.op]).toLowerCase())}</div>`:''}
    ${s.ans==='oui'&&key==='LIB'?'<div class="okbox">'+L('Le quai redeviendra <b>LIBRE</b> et le passage sera enregistré dans l’historique.')+'</div>':''}
   </div>
   <div class="mf"><button class="btn g" id="cx">${L('Annuler')}</button><button class="btn ${s.ans==='non'?'red':'ok'}" id="cf" ${s.ans?'':'disabled'}>${L('Confirmer')}</button></div>`);
  M.querySelectorAll('.step input').forEach(c=>c.onchange=()=>{s.chk[c.dataset.k]=c.checked;
    if(P.steps.every(([k])=>s.chk[k]))s.ans='oui';else if(s.ans==='oui')s.ans=null;phase(n,key,d,s)});
  M.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>{s.ans=b.dataset.a;if(s.ans==='oui')P.steps.forEach(([k])=>s.chk[k]=true);phase(n,key,d,s)});
  const nt=$('#nt');if(nt)nt.oninput=()=>s.note=nt.value;
  $('#cx').onclick=close;
  $('#cf').onclick=()=>{
    const failed=P.steps.filter(([k])=>!s.chk[k]).map(([k])=>k);
    if(s.ans==='oui'){
      ev(d,key+' OK');
      if(key==='SECU'){d.secuAt=now();phase(n,'OUV',d);return}
      if(key==='OUV'){d.status='vert';d.readyAt=now();d.ncPhase='';commit(n,d);close();toast(`${L('Quai')} ${n} ${L('prêt')} ✔`);return}
      if(key==='LIB'){release(n,d,'LIBÉRÉ');close();toast(`${L('Quai')} ${n} ${L('libéré')}`);return}
    } else {
      ev(d,key+' NON CONFORME',s.note,{failed});
      d.status='rouge';d.ncPhase=P.title;d.ncKey=key;d.ncFailed=failed;d.ncNote=s.note;d.ncAt=now();
      d.ncCount=(d.ncCount||0)+1;
      commit(n,d);close();toast(`${L('Quai')} ${n} ${L('non conforme')} ✖`);
    }
  };
}
function commit(n,d){S.docks[n]=d;render();pushDock(n)}
function release(n,d,outcome){
  d.releasedAt=now();ev(d,outcome);
  const h={id:n+'-'+d.checkinAt,dock:n,type:d.type,ref:refLabel(d),op:d.op,user:d.user,
    checkinAt:d.checkinAt,readyAt:d.readyAt||null,releasedAt:d.releasedAt,dur:mins(d.checkinAt,d.releasedAt),
    nc:d.ncCount||0,outcome,events:d.events};
  S.history.unshift(h);S.history=S.history.slice(0,1000);
  S.docks[n]=freeDock();render();pushDock(n);pushHist(h);
}

/* ---- HISTORIQUE ---- */
function histModal(f){
  f=f||{q:'',day:new Date().toISOString().slice(0,10)};
  const rows=S.history.filter(h=>(!f.day||new Date(h.checkinAt).toISOString().slice(0,10)===f.day)&&(!f.q||(h.ref+' '+h.dock+' '+h.user).toUpperCase().includes(f.q.toUpperCase())));
  const avg=rows.filter(r=>r.outcome==='LIBÉRÉ');const am=avg.length?Math.round(avg.reduce((a,r)=>a+r.dur,0)/avg.length):0;
  show(`<div class="mh"><h2>${L('Historique des passages')}</h2><span class="pill" style="background:var(--bar)">${rows.length}${L(' passage(s) · moy. ')}${fmtDur(am)} · ${rows.filter(r=>r.nc).length}${L(' avec NC')}</span></div>
   <div class="mb">
    <div style="display:flex;gap:8px;flex-wrap:wrap"><input type="date" id="hd" value="${f.day}" style="padding:9px;border-radius:10px;border:1.5px solid var(--line)"><input type="text" id="hq" placeholder="${L('Filtrer VRID, quai, opérateur…')}" value="${esc(f.q)}" style="flex:1;min-width:160px"></div>
    <div class="tbl"><table><thead><tr>${['Quai','Type','Référence','Opération','Check-in','Prêt','Libéré','Durée','NC','Statut','Opérateur'].map(x=>`<th>${L(x)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(h=>`<tr><td><b>${h.dock}</b></td><td>${h.type==='VRID'?'VRID':L(h.type)}</td><td>${esc(h.ref)}</td><td>${L(OPLBL[h.op]||'')}</td><td>${fmtT(h.checkinAt)}</td><td>${fmtT(h.readyAt)}</td><td>${fmtT(h.releasedAt)}</td><td>${fmtDur(h.dur)}</td><td style="color:${h.nc?'var(--nc)':'inherit'}">${h.nc||''}</td><td>${L(h.outcome)}</td><td>${esc(h.user)}</td></tr>`).join('')||`<tr><td colspan="11" style="color:var(--mute)">${L('Aucun passage')}</td></tr>`}</tbody></table></div>
   </div>
   <div class="mf"><button class="btn g" id="cx">${L('Fermer')}</button><button class="btn p" id="csv">${L('Exporter CSV')}</button></div>`,true);
  $('#cx').onclick=close;
  $('#hd').onchange=e=>histModal({...f,day:e.target.value});
  $('#hq').oninput=e=>{const p=e.target.selectionStart;histModal({...f,q:e.target.value});const i=$('#hq');i.focus();i.setSelectionRange(p,p)};
  $('#csv').onclick=()=>{
    const head=['Date','Quai','Type','Référence','Opération','Check-in','Prêt','Libéré','Durée (min)','Non-conformités','Statut','Opérateur','Journal'].map(L);
    const lines=rows.map(h=>[new Date(h.checkinAt).toLocaleDateString(LOC()),h.dock,h.type==='VRID'?'VRID':L(h.type),h.ref,L(OPLBL[h.op]||''),fmtT(h.checkinAt),fmtT(h.readyAt),fmtT(h.releasedAt),h.dur,h.nc,L(h.outcome),h.user,
      (h.events||[]).map(e=>fmtT(e.t)+' '+L(e.step)+(e.note?' ('+e.note+')':'')).join(' | ')]);
    const csv='﻿'+[head,...lines].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`DocK_LAVL_${f.day||'tout'}.csv`;a.click();
  };
}
/* ---- VRIDs (manuel en attendant Station One) ---- */
function vridModal(){
  show(`<div class="mh"><h2>${L('Liste VRID')}</h2><span class="pill" style="background:var(--bar)">${S.vrids.length} VRID</span></div>
   <div class="mb">
    <div class="hint">${online()?L('Mise à jour automatique depuis Station One toutes les ')+CONFIG.VRID_POLL_MS/1000+' s.':L('Mode local : colle ici les VRID (un par ligne, format « VRID ; CODE ; infos »).')}</div>
    <textarea id="vt" style="min-height:220px;font-family:ui-monospace,monospace">${esc(S.vrids.map(v=>[v.vrid,v.code||'',v.info||''].join(' ; ').replace(/( ; )+$/,'')).join('\n'))}</textarea>
   </div>
   <div class="mf"><button class="btn g" id="cx">${L('Fermer')}</button>${online()?`<button class="btn g" id="rf">${L('Rafraîchir')}</button>`:''}<button class="btn p" id="ok">${L('Enregistrer')}</button></div>`);
  $('#cx').onclick=close;
  if($('#rf'))$('#rf').onclick=async()=>{await pullVrids();vridModal()};
  $('#ok').onclick=()=>{
    S.vrids=$('#vt').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const [v,c,...r]=l.split(/[;\t]/);return {vrid:v.trim().toUpperCase(),code:(c||'').trim().toUpperCase(),info:r.join(' ').trim()}});
    lsSet();close();toast(S.vrids.length+L(' VRID enregistrés'));
  };
}
function userModal(){
  show(`<div class="mh"><h2>${L('Opérateur')}</h2></div><div class="mb"><input type="text" id="us" placeholder="${L('Ton nom')}" value="${esc(S.user)}"></div>
   <div class="mf"><button class="btn p" id="ok">OK</button></div>`);
  setTimeout(()=>$('#us').focus(),30);
  $('#ok').onclick=()=>{S.user=$('#us').value.trim();lsSet();render();close()};
}

/* ---- Infobulle au survol : toutes les infos (Station One + suivi) ---- */
const S1F=[['origine','Origine'],['statut','Statut S1'],['eta','ETA'],['cpt','CPT'],['packages','Colis'],['gaylords','Gaylords'],['gaylords_colis','Colis en gaylords'],['palettes','Palettes'],['palettes_colis','Colis en palettes'],['total_container_count','Contenants'],
  ['trailer_id','Remorque'],['equipment','Équipement'],['origin_departed_at','Départ origine'],['destination_arrived_at','Arrivé station'],
  ['delay_minutes','Retard (min)'],['remaining_km','Km restants'],['categorie','Catégorie'],['info','Infos']];
function tipHTML(n){
  const d=S.docks[n];
  if(d.status==='libre')return `<h4>${L('Quai')} ${n} · ${L('Libre')}</h4><div style="color:#9fb0c3">${L('Clique pour faire le check-in')}</div>`;
  if(d.status==='hs')return `<h4>${L('Quai')} ${n} · ${L('Hors service')}</h4><dl><dt>${L('Raison')}</dt><dd>${esc(d.note||'—')}</dd><dt>${L('Depuis')}</dt><dd>${fmtD(d.hsAt)}</dd></dl>`;
  const rows=[['Type',d.type==='VRID'?'VRID':L(d.type)],['Référence',refLabel(d)],['Code',d.code],['Opération',L(OPLBL[d.op])],['Check-in',fmtT(d.checkinAt)+' · '+(d.user||'')],
    ['Prêt',d.readyAt?fmtT(d.readyAt):''],['Temps à quai',fmtDur(mins(d.checkinAt))]];
  if(d.status==='rouge')rows.push(['Non conforme',L((PHASES[d.ncKey]||{}).title)+(d.ncNote?' — '+d.ncNote:'')]);
  const meta=metaOf(d);
  S1F.forEach(([k,l])=>{const v=meta[k];if(v===''||v==null||v==='0'&&k==='delay_minutes'||k==='info')return;
    rows.push([l,/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v)?fmtD(v):String(v).replace('FIFTY_THREE_FOOT_TRUCK',L('53 pieds'))])});
  if(!d.meta&&d.info)rows.push(['Infos',d.info]);
  return `<h4>${L('Quai')} ${n}</h4><dl>${rows.filter(r=>r[1]).map(r=>`<dt>${esc(L(r[0]))}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`;
}
const tip=$('#tip');
document.addEventListener('mousemove',e=>{
  const t=e.target.closest&&e.target.closest('.truck');
  if(!t||ov.classList.contains('open')){tip.style.display='none';return}
  tip.innerHTML=tipHTML(+t.dataset.n);tip.style.display='block';
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY+16;
  if(x+w>innerWidth-8)x=e.clientX-w-16; if(y+h>innerHeight-8)y=innerHeight-h-8;
  tip.style.left=x+'px';tip.style.top=y+'px';
});
/* ---- Taille des camions ---- */
let DW=140;try{DW=+localStorage.getItem('dock_dw')||140}catch(e){}
function setDW(v){DW=Math.max(60,Math.min(260,Math.round(v)));document.documentElement.style.setProperty('--dw',DW+'px');try{localStorage.setItem('dock_dw',DW)}catch(e){}}
function fitDW(){const w=$('.yardwrap').clientWidth-24-56;setDW(w/DOCKS.length)}

/* ================= INIT ================= */
$('#bHist').onclick=()=>histModal();
$('#bVrid').onclick=vridModal;
$('#bUser').onclick=userModal;
$('#search').oninput=render;
function tick(){$('#clock').textContent=new Date().toLocaleTimeString(LOC(),{hour:'2-digit',minute:'2-digit'})}
setDW(DW);$('#zm').onclick=()=>setDW(DW-20);$('#zp').onclick=()=>setDW(DW+20);$('#zf').onclick=fitDW;
applyStatic();$('#bLang').onclick=()=>setLang(LANG==='fr'?'en':'fr');
buildYard();render();renderSync();tick();
setInterval(tick,10000);
setInterval(()=>{if(!ov.classList.contains('open'))render()},30000);
if(online()){pull();pullVrids();setInterval(()=>{if(!ov.classList.contains('open'))pull()},CONFIG.POLL_MS);setInterval(pullVrids,CONFIG.VRID_POLL_MS)}
window.addEventListener('storage',e=>{if(e.key===LS){lsGet();render()}});
</script>
</body>
